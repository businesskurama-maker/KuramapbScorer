<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibration test · DinkyKong</title>
<style>body{margin:0;background:#0b1026;color:#fff;font:16px system-ui,sans-serif;padding:20px}h1{font-size:22px;margin:0 0 6px}p{color:#aab3d6;margin:0 0 16px}
button{display:block;width:100%;height:72px;margin:0 0 12px;border:0;border-radius:16px;background:#00E5FF;color:#021018;font-size:18px;font-weight:800}
button.b{background:#39FF14}button.c{background:#FFE600}pre{white-space:pre-wrap;background:#151b38;border-radius:12px;padding:12px;font-size:13px;color:#cfd6f5}</style></head>
<body><h1>Vibration test</h1><p>Tap each button. Tell us which ones you can feel.</p>
<button data-p="90">1 · Score tap (90 ms)</button>
<button class="b" data-p="400">2 · Long buzz (400 ms)</button>
<button class="c" data-p="200,100,200,100,200">3 · Pattern</button>
<pre id="out"></pre>
<script>
const out=document.getElementById('out');
const log=(t)=>{out.textContent=t+'\n'+out.textContent;};
log('Browser: '+navigator.userAgent+'\nVibration API: '+(typeof navigator.vibrate==='function'?'yes':'NO'));
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=b.dataset.p.split(',').map(Number);let r;try{r=navigator.vibrate?navigator.vibrate(p.length>1?p:p[0]):'no API';}catch(e){r='error '+e.message}log(b.textContent+' → '+(r===true?'phone accepted':r===false?'phone REFUSED':r));});
</script></body></html>
