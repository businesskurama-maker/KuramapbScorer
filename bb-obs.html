<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinkyKong Basketball · OBS overlay</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Orbitron:wght@700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --home: #00e5ff; --away: #ff2e4d; --glass: rgba(10, 13, 22, .94); --glass2: rgba(22, 27, 40, .94); --ink: #f4f6fb; --ink2: #9aa4bd;
    --warn: #ffb547; --brand: #39ff14; --digit: 'Orbitron', 'Poppins', sans-serif; --ui: 'Poppins', system-ui, sans-serif; --hold: 3000ms; --op: .94;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.preview { background: #1d2230 repeating-conic-gradient(#232a3a 0 25%, #1a1f2c 0 50%) 0 0 / 40px 40px; }
  body.preview.photo { background: radial-gradient(ellipse at 50% 30%, #8a5a2b 0, #4b2f16 45%, #1b120a 100%); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--ui); color: var(--ink); }
  .hidden { display: none !important; }
  .wrap { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%) scale(var(--scale, 1)); transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; gap: 0; transition: opacity .35s ease, transform .35s ease; }
  .pos-top .wrap { bottom: auto; top: 54px; transform-origin: 50% 0; flex-direction: column-reverse; }
  .pos-bottom-left .wrap { left: 64px; transform: scale(var(--scale, 1)); transform-origin: 0 100%; align-items: flex-start; }
  .pos-bottom-right .wrap { left: auto; right: 64px; transform: scale(var(--scale, 1)); transform-origin: 100% 100%; align-items: flex-end; }
  .wrap.off { opacity: 0; }

  /* ---------- main bar ---------- */
  .bar { display: flex; align-items: stretch; height: calc(84px * var(--bhs, 1)); filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); position: relative; }
  .side { display: flex; align-items: stretch; background: linear-gradient(180deg, var(--glass2), var(--glass)); opacity: 1; position: relative; overflow: hidden; }
  .side::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 46%); pointer-events: none; }
  .side.home { border-radius: 18px 0 0 18px; }
  .side.away { border-radius: 0 18px 18px 0; flex-direction: row-reverse; }
  .acc { width: 7px; background: var(--c); flex: none; }
  .logo { width: calc(84px * var(--bhs, 1)); flex: none; display: grid; place-items: center; background: rgba(255,255,255,.04); }
  .logo img { width: calc(62px * var(--bhs, 1) * var(--lgs, 1)); height: calc(62px * var(--bhs, 1) * var(--lgs, 1)); border-radius: 22%; object-fit: contain; }
  .logo.none { display: none; }
  .tname { display: flex; flex-direction: column; justify-content: center; padding: 0 22px; min-width: 150px; max-width: 360px; }
  .side.away .tname { align-items: flex-end; text-align: right; }
  .tname b { font-weight: 800; font-size: calc(34px * var(--nsz, 1)); letter-spacing: .06em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; text-transform: uppercase; }
  .full .tname b { font-size: calc(28px * var(--nsz, 1)); letter-spacing: .02em; }
  .meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; height: 16px; }
  .side.away .meta { flex-direction: row-reverse; }
  .fouls { font-size: calc(12.5px * var(--lsz, 1)); font-weight: 700; letter-spacing: .14em; color: var(--ink2); white-space: nowrap; }
  .fouls i { font-style: normal; color: var(--ink); margin-left: 4px; }
  .pen { font-size: calc(10.5px * var(--lsz, 1)); font-weight: 800; letter-spacing: .14em; padding: 2px 7px 1px; border-radius: 5px; background: var(--warn); color: #1b1200; display: none; }
  .pen.on { display: inline-block; }
  .tos { display: flex; gap: 4px; }
  .tos i { width: 13px; height: 5px; border-radius: 3px; background: var(--c); }
  .tos i.used { background: rgba(255,255,255,.16); }
  .score { width: 132px; flex: none; display: grid; place-items: center; position: relative; background: rgba(0,0,0,.28); }
  .score b { font-family: var(--digit); font-weight: 800; font-size: calc(54px * var(--dsz, 1)); color: var(--c); line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); }
  .font-bebas .score b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: calc(70px * var(--dsz, 1)); padding-top: 6px; }
  .font-poppins .score b { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: calc(54px * var(--dsz, 1)); }
  .score b.bump { animation: bump .6s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes bump { 0% { transform: translateY(40%); opacity: 0; } 60% { transform: translateY(-6%); opacity: 1; } 100% { transform: none; } }
  .side.flash::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 45%, transparent), transparent); animation: sweep .9s ease-out forwards; pointer-events: none; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .poss { position: absolute; top: 50%; width: 0; height: 0; border: 9px solid transparent; transform: translateY(-50%); opacity: 0; transition: opacity .3s; }
  .side.home .poss { right: 4px; border-left-color: var(--brand); border-right: 0; }
  .side.away .poss { left: 4px; border-right-color: var(--brand); border-left: 0; }
  .side.has-poss .poss { opacity: 1; }

  /* centre: period + clock */
  .mid { width: calc(232px * var(--dsz, 1)); flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #05070c; position: relative; border-left: 1px solid rgba(255,255,255,.08); border-right: 1px solid rgba(255,255,255,.08); }
  .per { font-size: calc(15px * var(--lsz, 1)); font-weight: 800; letter-spacing: .26em; color: var(--brand); padding-left: .26em; line-height: 1; }
  .clk { font-family: var(--digit); font-weight: 800; font-size: calc(40px * var(--dsz, 1)); line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .font-bebas .clk { font-family: 'Bebas Neue'; font-weight: 400; font-size: calc(50px * var(--dsz, 1)); }
  .font-poppins .clk { font-family: 'Poppins'; }
  .clk.low { color: #ffd84a; }
  .shot { position: absolute; right: 10px; bottom: 9px; font-family: var(--digit); font-weight: 800; font-size: calc(17px * var(--dsz, 1)); color: #ffd84a; min-width: 30px; text-align: right; }
  .shot.exp { color: #ff4d5e; animation: blink .5s steps(2) 6; }
  @keyframes blink { 50% { opacity: .2; } }
  .mid.ended .clk { color: #ff4d5e; }
  .mid.fin .clk, .mid.fin .shot { display: none; }
  .mid.fin .per { font-size: 30px; letter-spacing: .3em; }
  .fin .l { opacity: .7 !important; }
  /* external court timer window */
  .mid.ext .per { position: absolute; top: 6px; font-size: 11px; }
  .mid.ext .clk, .mid.ext .shot { display: none; }
  .mid.ext-black { background: #000; }
  .mid.ext-cutout { background: transparent; border-color: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  .mid.ext-cutout .per { text-shadow: 0 1px 4px #000; }
  .bar.cut .side { border-radius: 18px; }
  .bar.cut { gap: 0; }

  /* title tab (Tournament Pro) */
  .ttl { align-self: center; margin-bottom: -1px; padding: 6px 22px 5px; border-radius: 12px 12px 0 0; background: var(--glass); font-size: calc(13px * var(--lsz, 1)); font-weight: 700; letter-spacing: .22em; color: var(--ink2); text-transform: uppercase; display: none; }
  .ttl b { color: var(--brand); font-weight: 800; }
  .show-title .ttl { display: block; }
  .pos-top .ttl { border-radius: 0 0 12px 12px; margin: -1px 0 0; }

  /* ---------- pop-up lower third (player / foul / timeout / breaks / final) ---------- */
  .pop { align-self: stretch; display: flex; justify-content: center; height: 0; position: relative; }
  .card { position: absolute; bottom: 10px; left: 50%; width: max-content; min-width: 560px; max-width: 1100px; transform: translate(-50%, 24px); opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.3,1), opacity .3s ease;
    display: flex; align-items: stretch; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, var(--glass2), var(--glass)); filter: drop-shadow(0 10px 22px rgba(0,0,0,.45)); }
  .pos-top .card { bottom: auto; top: 10px; transform: translate(-50%, -24px); }
  .card.in { opacity: 1; transform: translate(-50%, 0); }
  .card .cacc { width: 8px; background: var(--c); flex: none; }
  .card .jer { min-width: 104px; padding: 0 18px; display: grid; place-items: center; background: var(--c); color: #071018; font-family: var(--digit); font-weight: 900; font-size: 44px; }
  .card .ph { width: 92px; flex: none; background: center / cover no-repeat rgba(255,255,255,.05); }
  .card .txt { padding: 14px 26px 13px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .card .txt b { font-size: 31px; font-weight: 800; letter-spacing: .03em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .card .txt small { margin-top: 5px; font-size: 15px; font-weight: 700; letter-spacing: .22em; color: var(--ink2); text-transform: uppercase; white-space: nowrap; }
  .card .val { padding: 0 26px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.3); font-family: var(--digit); font-weight: 900; font-size: 46px; color: var(--c); white-space: nowrap; }
  .card .val small { font-family: var(--ui); font-size: 15px; font-weight: 800; letter-spacing: .2em; color: var(--ink); }
  .card.foul .val { color: var(--warn); }
  .card.out .val, .card.out .txt small { color: #ff4d5e; }
  .card.banner { min-width: 520px; }
  .card.banner .txt { align-items: center; text-align: center; padding: 16px 40px 15px; flex: 1; }
  .card.banner .txt b { font-size: 36px; letter-spacing: .12em; }
  .card.banner .cnt { padding: 0 24px; display: grid; place-items: center; font-family: var(--digit); font-weight: 800; font-size: 34px; background: rgba(0,0,0,.35); color: var(--warn); }
  .card.final { min-width: 860px; }
  .card.final .txt { flex: 1; align-items: center; padding: 18px 30px; }
  .fin { display: flex; align-items: center; gap: 26px; font-weight: 800; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; }
  .fin .sc { font-family: var(--digit); font-size: 52px; }
  .fin .w { opacity: 1; } .fin .l { opacity: .55; }
  .fin-tag { font-size: 15px; font-weight: 800; letter-spacing: .4em; color: var(--brand); margin-bottom: 6px; }

  /* ---------- themes ---------- */
  .theme-classic .side { background: linear-gradient(180deg, #23283a, #12151f); }
  .theme-classic .tname { background: var(--c); color: #071018; }
  .theme-classic .tname .fouls, .theme-classic .tname .fouls i { color: rgba(0,0,0,.72); }
  .theme-classic .tname b { text-shadow: none; }
  .theme-classic .score b { color: #fff; text-shadow: none; }
  .theme-classic .tos i { background: rgba(0,0,0,.65); } .theme-classic .tos i.used { background: rgba(0,0,0,.18); }
  .theme-classic .acc { display: none; }
  .theme-minimal .side { background: rgba(0,0,0,.9); }
  .theme-minimal .side::before { display: none; }
  .theme-minimal .acc { width: 3px; }
  .theme-minimal .logo { background: none; }
  .theme-minimal .score { background: none; }
  .theme-minimal .score b { text-shadow: none; }
  .theme-minimal .bar { height: 70px; }
  .theme-minimal .tname b { font-size: 28px; font-weight: 700; }
  .theme-minimal .mid { background: #000; }
  .theme-minimal .per { color: #fff; }
  .theme-tournament .ttl { display: block; }
  /* category-round · event banner (sits on top of the lower third) */
  .rbn { --rbh: calc(40px * var(--rsz, 1)); --rfs: calc(17px * var(--rsz, 1)); align-self: stretch; display: none; align-items: stretch; height: var(--rbh); margin-bottom: 6px; border-radius: 12px; overflow: hidden; background: var(--rb-bg, var(--glass)); filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
  .show-round .rbn { display: flex; }
  .show-round .ttl { display: none !important; }
  .rbn .rr { flex: none; display: flex; align-items: center; padding: 0 calc(20px * var(--rsz, 1)); background: var(--rnd, var(--brand)); color: var(--rnd-ink, #04130a); font-weight: 900; font-size: var(--rfs); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; position: relative; }
  .rbn .rr::after { content: ''; position: absolute; right: -14px; top: 0; bottom: 0; width: 28px; background: inherit; transform: skewX(-20deg); }
  .rbn .re { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 22px 0 30px; font-weight: 800; font-size: var(--rfs); letter-spacing: .2em; text-transform: uppercase; color: var(--evt, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rbn.solo-r .re, .rbn.solo-e .rr { display: none; }
  .rbn.solo-r .rr { flex: 1; justify-content: center; }
  .rbn.solo-r .rr::after { display: none; }
  .rbn.in { animation: rbnIn .6s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes rbnIn { from { clip-path: inset(0 50% 0 50%); opacity: .2; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  .pos-top .rbn { margin: 6px 0 0; }
  .theme-classic .rbn .rr { background: var(--rnd, var(--home)); color: var(--rnd-ink, #071018); }
  .theme-minimal .rbn { background: var(--rb-bg, rgba(0,0,0,.9)); border-radius: 6px; }
  .theme-minimal .rbn .rr { background: var(--rnd, #fff); color: var(--rnd-ink, #000); }
  .theme-tournament .bar { height: calc(92px * var(--bhs, 1)); }
  /* custom scoreboard colour */
  .custom-bar .side, .custom-bar .theme-electric .side { background: linear-gradient(180deg, var(--glass2), var(--glass)) !important; }
  .custom-bar.theme-classic .tname { background: var(--c); }
  .no-logos .logo { display: none !important; }
  /* ---- round banner templates ---- */
  /* 2 · Ribbon: one coloured ribbon, category and title centred with a divider */
  .rb-ribbon .rbn { background: var(--rnd, var(--brand)); border-radius: 4px; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); justify-content: center; }
  .rb-ribbon .rbn .rr, .rb-ribbon .rbn .re { flex: none; background: none; padding: 0 14px; }
  .rb-ribbon .rbn .rr::after { display: none; }
  .rb-ribbon .rbn .rr { color: var(--rnd-ink, #04130a); }
  .rb-ribbon .rbn .re { color: var(--rnd-ink, #04130a); opacity: .82; position: relative; padding-left: 26px; }
  .rb-ribbon .rbn .re::before { content: ''; position: absolute; left: 6px; top: 50%; width: 8px; height: 8px; border-radius: 2px; background: currentColor; transform: translateY(-50%) rotate(45deg); }
  .rb-ribbon .rbn.solo-r .re, .rb-ribbon .rbn.solo-e .rr { display: none; }
  .rb-ribbon .rbn.solo-e .re { padding-left: 14px; } .rb-ribbon .rbn.solo-e .re::before { display: none; }
  /* 3 · Stacked: small category on top, big event title below */
  .rb-stack .rbn { flex-direction: column; height: auto; padding: calc(6px * var(--rsz, 1)) 0 calc(8px * var(--rsz, 1)); align-items: center; border-bottom: 3px solid var(--rnd, var(--brand)); border-radius: 12px 12px 4px 4px; }
  .rb-stack .rbn .rr { background: none; color: var(--rnd, var(--brand)); font-size: calc(var(--rfs) * .72); letter-spacing: .3em; padding: 0; }
  .rb-stack .rbn .rr::after { display: none; }
  .rb-stack .rbn .re { flex: none; padding: 2px 24px 0; font-size: calc(var(--rfs) * 1.25); letter-spacing: .12em; font-weight: 900; }
  .rb-stack .rbn.solo-r .rr { font-size: var(--rfs); }
  /* 4 · Pill: compact floating pill, centred */
  .rb-pill .rbn { align-self: center; border-radius: 999px; padding: 4px; gap: 0; height: calc(var(--rbh) + 8px); border: 2px solid var(--rnd, var(--brand)); }
  .rb-pill .rbn .rr { border-radius: 999px; }
  .rb-pill .rbn .rr::after { display: none; }
  .rb-pill .rbn .re { flex: none; padding: 0 22px 0 18px; }
  .rb-pill .rbn.solo-r .rr { flex: none; }
  .theme-minimal.rb-stack .rbn, .theme-minimal.rb-pill .rbn { height: auto; }
  .theme-electric .side { background: linear-gradient(180deg, rgba(26,31,46,var(--op)), rgba(8,10,18,var(--op))); }
  .reduced * { animation: none !important; transition-duration: .01s !important; }
</style>
</head>
<body>
<div id="stage">
  <div class="wrap" id="wrap">
    <div class="pop" id="pop"></div>
    <div class="rbn" id="rbn"><span class="rr" id="rbnR"></span><span class="re" id="rbnE"></span></div>
    <div class="ttl" id="ttl"></div>
    <div class="bar" id="bar">
      <div class="side home" id="sH" style="--c:var(--home)">
        <div class="acc"></div><div class="logo none" id="lH"><img alt=""></div>
        <div class="tname"><b id="nH">HOME</b><div class="meta"><span class="fouls" id="fH">FOULS<i>0</i></span><span class="pen" id="pH">PENALTY</span><span class="tos" id="tH"></span></div></div>
        <div class="score"><b id="scH">0</b></div><span class="poss"></span>
      </div>
      <div class="mid" id="mid"><span class="per" id="per">Q1</span><span class="clk" id="clk">10:00</span><span class="shot" id="shot"></span></div>
      <div class="side away" id="sA" style="--c:var(--away)">
        <div class="acc"></div><div class="logo none" id="lA"><img alt=""></div>
        <div class="tname"><b id="nA">AWAY</b><div class="meta"><span class="fouls" id="fA">FOULS<i>0</i></span><span class="pen" id="pA">PENALTY</span><span class="tos" id="tA"></span></div></div>
        <div class="score"><b id="scA">0</b></div><span class="poss"></span>
      </div>
    </div>
  </div>
  <div id="msg" style="position:absolute;left:40px;top:40px;font:600 22px Poppins,sans-serif;color:#fff;text-shadow:0 2px 6px #000"></div>
</div>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/bb-core.js"></script>
<script src="js/bb-obs.js"></script>
</body>
</html>
